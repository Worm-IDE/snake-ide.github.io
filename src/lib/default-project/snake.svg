<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Snake body -->
  <path
    d="M10 40
       C 10 28, 20 24, 26 26
       C 34 29, 34 38, 30 42
       C 24 48, 26 54, 34 56
       C 44 58, 52 52, 52 42
       C 52 32, 46 26, 38 24
       C 30 22, 24 18, 24 12
       C 24 8, 28 6, 32 6
       C 36 6, 40 8, 40 12
       C 40 15, 38 17, 36 18"
    fill="none"
    stroke="#708238"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Snake head -->
  <circle cx="36" cy="18" r="4" fill="#708238" />
  <!-- Eyes -->
  <circle cx="35" cy="17" r="0.7" fill="#ffffff" />
  <circle cx="37" cy="17" r="0.7" fill="#ffffff" />

  <!-- Tongue -->
  <path
    d="M38.5 19
       L 41 20
       L 40 21
       L 41 22"
    fill="none"
    stroke="#c0392b"
    stroke-width="1.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Belly segments -->
  <path
    d="M12 39
       C 12 31, 20 28, 26 30
       C 32 32, 32 38, 28 42
       C 22 48, 24 52, 32 54
       C 42 56, 50 50, 50 42"
    fill="none"
    stroke="#9bb56a"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="3 3"
  />
</svg>
