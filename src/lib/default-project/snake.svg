<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">
  <!-- Coiled snake body -->
  <path
    d="M20 50
       C 20 38, 30 32, 40 34
       C 52 36, 54 46, 48 52
       C 42 58, 34 58, 30 54
       C 26 50, 26 44, 32 42
       C 38 40, 46 42, 50 46
       C 54 50, 56 56, 54 60
       C 50 68, 40 72, 30 70
       C 22 68, 16 62, 16 54
       C 16 48, 18 52, 20 50"
    fill="#708238"
    stroke="#4f5a24"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Neck + head rising from coil -->
  <path
    d="M42 40
       C 44 34, 46 28, 46 22
       C 46 16, 50 12, 56 12
       C 62 12, 66 16, 66 22
       C 66 26, 64 30, 60 32"
    fill="#708238"
    stroke="#4f5a24"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Head circle -->
  <circle cx="60" cy="32" r="7" fill="#708238" stroke="#4f5a24" stroke-width="2.5" />

  <!-- Eyes -->
  <circle cx="58" cy="30.5" r="1.4" fill="#ffffff" />
  <circle cx="62" cy="30.5" r="1.4" fill="#ffffff" />
  <circle cx="58" cy="30.5" r="0.7" fill="#2e374a" />
  <circle cx="62" cy="30.5" r="0.7" fill="#2e374a" />

  <!-- Cute smile -->
  <path
    d="M57 33.5
       C 58.5 35, 61.5 35, 63 33.5"
    fill="none"
    stroke="#2e374a"
    stroke-width="1.4"
    stroke-linecap="round"
  />

  <!-- Tongue -->
  <path
    d="M63.5 33.8
       L 67 35
       L 66 36
       L 67 37"
    fill="none"
    stroke="#c0392b"
    stroke-width="1.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Belly highlight -->
  <path
    d="M22 50
       C 22 40, 32 36, 40 38
       C 48 40, 50 46, 46 52
       C 40 60, 30 60, 26 56"
    fill="none"
    stroke="#9bb56a"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="3 3"
  />
</svg>
